the stone heart of a mountain that refused to kneel. Neither will you.`,l_echo_mask:`Whatever you whisper behind it, the deep whispers back. Louder.`,l_codex_ruin:`Its pages list every empire that will fall. Several entries have already been crossed out.`,l_phoenix:`Plucked from a firebird mid-rebirth. It was very annoyed, briefly, and then again.`,l_thousand_hands:`Belonged to a monk who swore to strike every foe at once. He nearly managed it.`,l_gnasher_fang:`Pried from the jaw of Gnasher, the Pack Lord. It still hungers, and it still bites.`,l_rot_heart:`Torn from the Mother of Rot in her sewer throne. It beats slow, and it smells worse.`,l_cinder_censer:`Brother Cinder swung it through every sermon. The congregation never sat in the front row twice.`,l_varkas_wall:`Varkas the Iron Warden held the gate with this for a century. It remembers every one who tried.`,l_morwen_tear:`The single tear Morwen the Frost Queen ever shed. It froze before it reached the floor.`,l_skarn_horn:`Skarn the Storm Herald blew it to announce the end of the world. The world was not ready.`,l_hollow_decree:`Written in the Hollow King's own hand: a law that all things must end. Most do.`,l_worldsplitter:`Legend says the dungeon's first fissure was a practice swing.`,l_bastion_ages:`Older than the dungeon, older than the kings who dug it. It has outlasted all of them.`,l_wyrmscale:`Cut from a dragon that bathed in fire, venom and blood, and found all three boring.`,l_bloodletter:`A barber-surgeon's blade, long retired from medicine. It never lost the taste.`,l_wand_of_echoes:`Carved from a tree that grew in a canyon. Say anything near it and the canyon still answers.`,l_conduit_scepter:`A lightning rod for wizards. It was never meant to keep the lightning.`,l_twinfang:`Forged as one dagger and split by a jealous smith. Each half still goes looking for the other, through whoever is in the way.`,l_eclipse_pair:`Two blades made for a pair of sisters who never fought apart. When one fell, the other kept both swords, and both promises.`,l_stormbreaker:`Its wielder rode the lightning down from the peaks, then did it again for the applause.`,l_gamblers_ruin:`Every bet is all or nothing. Its owners tend to leave the table one way or the other.`,l_wardens_oath:`Sworn by the wardens of the gate to the netherworld: hold the line, and strike from it.`,l_lich_phylactery:`A lich hid its soul inside for safekeeping. It has been quietly snacking ever since.`,l_dawnbringer:`Carried by the saint who lit the first lamp in the deep. The dark has not forgiven her.`,l_font_absolution:`A holy font hammered into a weapon by a priest who found prayer too slow.`,l_confessional:`Every sin spoken into it is returned to the sender, with interest.`,l_anointed_plate:`Oiled with the tears of a hundred saints. It shines, and it smoulders.`,l_storm_rod:`Conductor's baton of the Storm Choir. They sang one perfect chord, and were never seen again.`,l_elemental_codex:`An archmage tried to write the four elements into one book. They have been arguing ever since.`,l_thunderhead:`Cut from the heart of a storm that circled one valley for a thousand years.`,l_tidecaller:`Woven by a sea witch who drowned a navy out of spite. The hem is always damp.`,l_cinderheart:`Quenched in a dying volcano. The volcano is still dying; the sword is not.`,l_furnace_heart:`Brother Cinder's flock once kept this burning in their chapel. They kept it fed, too.`,l_hydra_lash:`Braided from the necks of a hydra. Cut one strand and two more opinions grow back.`,lx_sunblade:`Forged at noon on the longest day. Vampires in the Crimson vaults still speak of it in whispers.`,lx_winters_grasp:`A frost giant's grip, taken whole. It never quite let go of its last handshake.`,lx_void_staff:`Carved from nothing, by someone who had nothing left to lose.`,lx_regicide:`Seven kings died by this dagger. The eighth bought it, and slept poorly.`,lx_hammer_judgement:`The saints' verdict, delivered in person. Appeals are not heard.`,lx_bulwark_kings:`Every old king of the realm hid behind it at least once. None of them told anyone.`,lx_inferno_heart:`The beating core of a fire elemental. It is warm, and it is not friendly.`,lx_seraph_wing:`A single feather of a fallen seraph. She wants it back, but she can wait.`,lx_book_dead:`Every name written in it is a promise. The ink is never quite dry.`,lx_windwall:`A buckler with a gale trapped behind it. Arrows go somewhere else, usually somewhere rude.`,lx_dragonlord_plate:`Worn by the last rider of the dragons. Her mount was buried in the rest of the set.`,lx_shadow_mantle:`Stitched from the shadow of an assassin who outlived his own name.`,lx_archmage_regalia:`The archmage left these robes behind when he ascended. He left the stains, too.`,lx_titan_hide:`The titan did not give it willingly. The titan also did not survive asking.`,lx_saint_shroud:`The shroud of a saint who refused to stay buried. Out of kindness, mostly.`,lx_tempest_eye:`Plucked from the still centre of a hurricane. The storm around it still looks for it.`,lx_ring_titans:`Sized for a titan's little finger. On you, it makes a fine belt for the soul.`,lx_coin_fate:`Two faces, one fate. It has never landed on its edge, though it has thought about it.`,lx_heart_world:`Chipped from the root of the world, deep below the dungeon. The world misses it.`,lx_thorn_king:`The Thorn King wore it to bed. He was never once stabbed in his sleep, though many tried.`,lx_four_winds:`Each wind was bound by a different hermit. None of the four ever agreed on a direction.`,lx_sunfire_charm:`A shard of dawn kept in a locket. Do not open it near your eyebrows.`,lx_last_wall:`When every other wall fell, this one stood. It has been insufferable about it since.`,lx_mantle_unmaking:`Woven from threads pulled out of the world's seams. Things come apart near it.`,lx_hourglass:`A duelist's timepiece. He never stopped moving long enough to read it.`,lp_sovereign_blade:`Seven kings carried it. Six of them deserved to.`,lp_titanfall:`The titan it was named for is still lying where it fell.`,lp_kingsfang:`It has no edge you can see. Only the ones you feel.`,lp_unbroken_bulwark:`Dents from a thousand battles, and not one crack.`,lp_aegis_first_king:`Every king since has tried it on. None have filled it.`,lp_windcutter:`Sewn from a storm that lost its way underground.`,lp_mountain_heart:`Carved out of the mountain's root. The mountain wants it back.`,lx_mountain_fist:`It has never been opened. It has opened a great many things.`,lx_gorehowl:`Its edge has never been cleaned. It has never needed to be.`,lx_untouched_veil:`Its last wearer died of old age, unscratched and very bored.`,lx_worldbreaker:`The first blow made the valleys. The second is still coming.`,lx_colossus_blade:`A giant's sword. The giant isn't coming back for it.`,lx_briar_king:`He grew the thorns to keep the world out. They kept growing.`,lx_dragons_tithe:`Every coin on it remembers which hoard it came from.`,lx_final_word:`No one has ever argued with it twice.`,lx_fortunes_favor:`Found on a gambler who never lost. He died of old age, rich.`,lx_nightfall:`Its last owner was never seen. Plenty of people felt him.`,lx_kingslayer:`Three crowns have rolled because of it. It is patient about the fourth.`,lx_crown_of_embers:`Forged for a king who swore he would never be cold again. He kept his word.`,lx_hearthfall:`Every fire it starts remembers the last one.`,lx_berserker_mask:`No one remembers the face beneath it. Neither did its owner, after the first battle.`,lx_ruinous_eye:`It sees the crack in everything. Then it widens it, a little at a time.`,lx_gilded_skull:`A miser had his own skull gilded before death. He insists it was worth the investment.`,lx_vanity_mirror:`A queen asked it who was fairest. It told her the truth, and then where to stab.`,lx_heart_thorns:`A heart that loved once and was wounded. It made sure it would never be the only one hurt.`,lx_saint_halo:`The last saint took it off only once, to bless the Abyss. The Abyss did not thank her.`,lx_forgiving_saint:`She forgave every wrong done to her, twice. Her enemies found this deeply unsettling.`,lx_tenfold_edge:`Its smith struck it ten times ten thousand times. It likes to return the favour.`,lx_lantern_deep:`Its flame was lit in the deepest dark the dungeon holds. It has never once flickered.`,lx_skin_of_the_deep:`Shed by something that lives on the twentieth floor down. It has grown a new one.`,lx_choir_below:`A hymnal for a choir that sings at the gate to the netherworld. Do not hum along.`,lx_winters_verdict:`Quenched in the Ice Forge's coldest vat. Its judgement is final, and very slow to thaw.`,lx_nevermelt:`A splinter of the Ice Forge's anvil. Summer has tried for an age to melt it.`,lx_avalanche:`The Ice Forge's smiths shaped it from a mountain's worth of falling snow, still falling.`,lx_polar_scepter:`Sceptre of a court that ruled the frozen north until it simply stopped moving.`,lx_heart_of_winter:`The Ice Forge burns on this. It was not pleased to be borrowed.`,lx_long_winter:`Made in the Ice Forge to end a war by freezing both armies. It worked splendidly.`,lx_ice_crown:`The smith-king of the Ice Forge wore it until his beard froze to his throne.`,lx_endless_winter_mirror:`Look into it and see the Ice Forge's endless winter. It is looking back at you.`,lx_red_tithe:`The Crimson vaults collect what they are owed. This ring makes sure the payments never stop.`,lx_subjugation:`Old kings wore it to make rivals kneel. Most of them kneeled in the end anyway.`,lx_titan_heart:`It still beats, slow as a mountain's pulse. Each beat makes you feel taller.`,lx_mountainbreaker:`Dwarves forged it to dig. They stopped when the mountain started to apologise.`,lx_worldsunder:`Its first swing split a kingdom. Its second split the historians arguing about it.`,lx_mountain_king:`The Mountain King kept order with this and nothing else. Order was very well kept.`,lx_self_given_pyre:`A martyr's flame, kindled from her own life. She would like you to share the cost.`,lx_endless_alembic:`An alchemist's still that never stops dripping. He drowned, oddly happy, in his own work.`,la_flaskwarden:`The Flaskwarden kept the apothecary of a besieged keep. The siege ran out before she did.`,lo_chalice_plenty:`Poured from at a saint's last feast. Somehow, there was always one more cup.`,lx_thunderclap:`A hammer forged in a thunderhead's heart. On quiet nights you can hear it grumbling about the weather.`,lx_bloodmoon_scythe:`Its reaper only worked when the moon ran red. He kept very strange hours.`,lx_oathkeeper:`A knight swore to hold the gate forever. He did. The shield kept the promise after he couldn't.`,lx_eclipse_robes:`Woven in the minute the sun went dark. The seamstress has not been seen in daylight since.`,lx_fortunes_favour:`A gambler's last charm, won from the dungeon in a game it still insists was rigged.`,lx_endless_hunger:`A ring that eats. Nobody remembers who fed it first, and nobody has managed to stop.`},Cu={label:`Walk away`,run:()=>`You leave it be.`},wu=e=>t=>Math.ceil(t.maxHp()*e),Tu=e=>t=>t.hp()>wu(e)(t),Eu=(e,t,n,r)=>({label:`${t} · ${Math.round(e*100)}% Max HP`,hint:n||void 0,can:Tu(e),run:t=>{let n=wu(e)(t);return t.hurt(n),`🩸 You bleed ${n} into the basin. ${r(t)}`}}),Du=[{id:`crossroads`,unique:!0,weight:.12,minFloor:2,title:`The Crossroads`,icon:`🌒`,text:``,options:[]},{id:`sanguine_altar`,weight:.8,title:`The Sanguine Altar`,icon:`🩸`,text:`A basin of black stone, stained to the rim. Carved hands reach up from its sides, palms open. It does not want gold.`,options:[Eu(.1,`A trickle for Gold`,`A good purse of Gold`,e=>{let t=25+10*e.floor();return e.addGold(t),`Coins well up from the stain: +${t} Gold.`}),Eu(.2,`Blood for blood`,`Raise your Max HP`,e=>{let t=8+Math.floor(e.floor()/2);return e.addMaxHp(t),`Your heart beats harder: +${t} Max HP.`}),Eu(.3,`Temper your gear`,`A random equipped item gains 4 levels`,e=>{let t=e.upgradeRandom(4);return t?`${t} drinks deep and grows stronger (+4 levels).`:`You carry nothing for it to temper. The altar keeps your blood anyway.`}),Eu(.4,`Wash away your curses`,`Lifts every curse you carry`,e=>{let t=e.clearCurses();return t?`${t} curse${t===1?``:`s`} dissolve in the red.`:`You had no curses. The altar keeps your blood anyway.`}),Eu(.5,`Take on a random curse`,``,e=>`A whisper settles in your bones. You are cursed: ${e.addCurse()}.`),Eu(.6,`An offering for a relic`,`A random Common relic`,e=>`Something small and warm rises from the basin: ${e.gainCommonRelic()}.`),Eu(.7,`Pray for a Crimson Key`,`A slim chance. Most likely nothing at all`,e=>e.rng()<.12?(e.addCrimsonKey(),`The basin boils and spits out a key, red as a wound. 🗝️ A Crimson Key!`):`The basin drinks, and drinks, and gives nothing back.`),Eu(.8,`A deep sacrifice`,`A Rare item; a slim chance of Epic, slimmer of Legendary, slimmer still of Crimson`,e=>{let t=e.rng(),n=t<.01?`crimson`:t<.04?`legendary`:t<.14?`epic`:`rare`;return e.gainItem(n),`The altar gives back something heavy.`}),Eu(.9,`Nearly everything`,`An Epic item; a slim chance of Legendary, slimmer of Crimson`,e=>{let t=e.rng(),n=t<.03?`crimson`:t<.13?`legendary`:`epic`;return e.gainItem(n),`You sway, grey and cold. The altar is pleased, and gives back something fine.`}),Cu]},{id:`cleansing_well`,weight:.3,needCurse:!0,title:`The Well of Cleansing`,icon:`⛲`,text:`A circle of white stone, and water so clear it seems to glow. Your curses grow heavy just looking at it, as if they know.`,options:[{label:`Drink from the well`,hint:`Lifts every curse you carry`,run:e=>{let t=e.clearCurses();return`The water is cold enough to hurt. Something black and oily leaves you and sinks out of sight. ${t} curse${t===1?``:`s`} lifted.`}},{label:`Walk away`,run:()=>`You leave the water undisturbed.`}]},{id:`holy_tribute`,weight:1,needCurse:!0,title:`Holy Tribute`,icon:`🕍`,text:`A small chapel, half sunk into the rock. A hooded priest waits beside a collection plate. "The light can lift what clings to you. The light also has upkeep."`,options:[{label:`Approach the priest`,run:()=>``}]},{id:`lucky_pot`,weight:.35,minFloor:6,minGold:100,title:`The Lucky Pot`,icon:`🍀`,text:`A battered iron pot sits in a shaft of light that has no business being down here. It hums. It smells faintly of clover.`,options:[{label:`Throw all your Gold into the pot`,hint:`Every coin you carry (the pot wants a minimum, more on deeper floors)`,can:e=>e.gold()>=e.needGold(),run:e=>{let t=e.gold();return e.addGold(-t),e.cloverBlessing(),`${t} Gold clatters into the pot and vanishes. A tiny green leaf drifts down into your palm. 🍀 Four-Leaf Clover: your next 4 chests are a little luckier (slightly better odds of Rare, Epic and Legendary).`}},{label:`Leave`,run:()=>`You keep your coin. The humming stops.`}]},{id:`angelic_statue`,weight:1,minFloor:2,title:`The Angelic Statue`,icon:`👼`,text:`A marble angel stands untouched by the dark, wings spread. Its outstretched hands are cupped, as if waiting for something precious.`,options:[{label:`Offer half your HP`,hint:`Lifts every curse; for your next 2 fights you heal 2 at the start and nothing negative can touch you`,run:e=>(e.hurt(Math.floor(e.hp()/2)),e.angelicBlessing(),`Warm light pours over you. Your curses fall away like ash, and wings of light fold around you. 👼 Angelic Blessing: for your next 2 fights, you heal 2 at the start and you're immune to every negative status.`)},{label:`Leave`,run:()=>`You bow your head and move on.`}]},{id:`chained_dragon`,weight:1,title:`A Chained Dragon`,icon:`🐉`,text:`You find a sleeping drake chained to the dungeon walls. It's guarding something.`,options:[{label:`Try to steal what it's guarding`,hint:`Quietly…`,run:e=>{let t=e.rng();if(t<.06)return e.wakeDragon(),`A chain rattles. One great eye opens…`;if(t<.18){let t=40+15*e.floor();return e.addGold(t),`You slip a heavy purse out from under its claw: ${t} Gold!`}let n=5*e.floor();return e.addGold(n),`You pocket a few loose coins (${n} Gold) and back away.`}},{label:`Leave it be`,run:()=>`Some things are better left sleeping.`}]},{id:`alchemist`,unique:!0,weight:.8,title:`The Alchemist`,icon:`⚗️`,text:`A woman with stained gloves and a bandolier of glowing vials looks you up and down. "Everything works on anything. Even the big ones. It isn't cheap."`,options:[{label:`See her wares`,run:()=>``}]},{id:`blind_dragon`,weight:1,minFloor:3,minGold:100,title:`A Dragon's Blessing`,icon:`🐲`,text:`You find a blind, toothless dragon chained within a room. "Hello… Is anyone there? Would you spare me some gold? I will grant you a blessing in return."`,options:[{label:`Give it 70% of your Gold`,hint:`A blessing for your next 5 fights`,can:e=>e.gold()>=e.needGold(),run:e=>(e.addGold(-Math.ceil(e.gold()*.7)),`The old dragon smiles. "Thank you, friend." ${e.dragonBlessing()} (for your next 5 fights).`)},{label:`Leave`,run:()=>`"…Hello?" it calls after you.`}]},{id:`golden_altar`,unique:!0,title:`The Golden Altar`,icon:`🏺`,text:`A golden altar hums in the dark. Coins left on it vanish; now and then, something is left in return. Each tribute costs a fifth of your Gold. Pay as often as you like.`,options:[{label:`Pay tribute (20% of your Gold)`,hint:`Usually nothing. Sometimes something.`,repeat:!0,can:e=>e.gold()>0,run:e=>{let t=Math.max(1,Math.ceil(e.gold()*.2));e.addGold(-t);let n=e.rng();return n<.005?(e.gainItem(`legendary`),`You lay down ${t} Gold. The altar blazes gold: a Legendary!`):n<.02?(e.gainItem(`epic`),`You lay down ${t} Gold. The altar glows violet: an Epic item!`):n<.05?(e.gainItem(`rare`),`You lay down ${t} Gold. The altar glows blue: a Rare item.`):n<.13?(e.gainItem(`uncommon`),`You lay down ${t} Gold. Something clinks onto the altar: an Uncommon item.`):`You lay down ${t} Gold. It vanishes. Nothing happens.`}},{label:`Leave the altar`,run:()=>`You step away from the altar.`}]},{id:`blacksmith`,unique:!0,title:`The Wandering Blacksmith`,icon:`⚒️`,text:`A blacksmith has set up a portable anvil in a side passage. "Two jobs, free of charge. I like your face."`,options:[{label:`Visit the anvil`,run:()=>``}]},{id:`dealer`,title:`The Crossroads Dealer`,icon:`🎩`,text:`A smiling figure offers a trade: one of your relics for two of theirs, sight unseen.`,options:[{label:`Trade a random relic for two`,can:e=>e.relicCount()>0,run:e=>`You gave up ${e.loseRelic()} and received ${e.gainRelic()} and ${e.gainRelic()}.`},Cu]},{id:`fountain`,title:`Blood Fountain`,icon:`⛲`,text:`Red water bubbles from cracked stone. It whispers of treasure for those who bleed.`,options:[{label:`Bleed into it (lose 8 HP)`,hint:`A Rare item`,can:e=>e.hp()>8,run:e=>(e.hurt(8),`The fountain gives up a treasure (${e.gainItem(`rare`).rarity}).`)},{label:`Drink from it`,hint:`Heals you a little, with a chance of a curse`,run:e=>(e.healPct(.3),e.rng()<.4?`Refreshing… and wrong. Cursed: ${e.addCurse()}.`:`Refreshing. Nothing else happens.`)},Cu]},{id:`dice`,title:`The Gambling Den`,icon:`🎲`,text:`Bone dice clatter on a crate. "Double or nothing, friend?"`,options:[{label:`Bet 25 Gold`,hint:`A chance to double your bet`,can:e=>e.gold()>=25,run:e=>e.rng()<.5?(e.addGold(25),`You win! +25 Gold.`):(e.addGold(-25),`You lose 25 Gold.`)},Cu]},{id:`smith`,title:`The Wandering Smith`,icon:`⚒️`,text:`A dwarf with a portable anvil offers to sharpen your weapon.`,options:[{label:`Pay 30 Gold`,hint:`+1 level to your weapon`,can:e=>e.gold()>=30,run:e=>e.upgradeWeapon()||(e.addGold(-30),`Your weapon gleams. +1 level.`)},Cu]},{id:`fallen`,title:`A Fallen Adventurer`,icon:`⚰️`,text:`A body slumped against the wall, their pack still full.`,options:[{label:`Search the pack`,hint:`An Uncommon item, with a chance of a curse`,run:e=>(e.gainItem(`uncommon`),e.rng()<.3?`You find gear… and a curse: ${e.addCurse()}.`:`You find gear they won't need anymore.`)},{label:`Bury them`,hint:`+1 Potion, +5 Max HP`,run:e=>(e.addPotions(1),e.addMaxHp(5),`You feel lighter. +1 Potion, +5 Max HP.`)}]},{id:`spring`,title:`Sacred Spring`,icon:`💧`,text:`Cle
