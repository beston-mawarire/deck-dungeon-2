# Read-only look at the leaderboard database: the latest runs and, for hidden ones, why they weren't verified.
# Run by hand from the Actions tab ("Run workflow").
name: Inspect leaderboard
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUFARE_ACCOUNT_ID || secrets.CLOUDFARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g wrangler@4
      - name: Latest runs
        run: wrangler d1 execute deck-dungeon-lb --remote -y --command "SELECT id, name, mode, origin, floor, won, kills, level, version, suspect, reason, datetime(created_at/1000, 'unixepoch') AS at FROM runs ORDER BY created_at DESC LIMIT 15"
      - name: Latest sessions
        run: wrangler d1 execute deck-dungeon-lb --remote -y --command "SELECT substr(sid,1,6) AS sid, floor, max_floor, flagged, ended, posted_floor, datetime(started_at/1000, 'unixepoch') AS started, datetime(floor_at/1000, 'unixepoch') AS floor_at FROM sessions ORDER BY started_at DESC LIMIT 15"
