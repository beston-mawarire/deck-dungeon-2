# Deploys the leaderboard Worker and its D1 database to Cloudflare.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Runs on every push that touches /leaderboard, or by hand from the Actions tab ("Run workflow").
name: Deploy leaderboard
on:
  push:
    branches: [main]
    paths: ["leaderboard/**", ".github/workflows/leaderboard.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leaderboard
    env:
      # (Also accepts the secrets as they were first saved, spelled CLOUDFARE_… / CLOUFARE_….)
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUFARE_ACCOUNT_ID || secrets.CLOUDFARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install -g wrangler@4
      - name: Make sure the database exists
        run: |
          find_id() { wrangler d1 list --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const x=JSON.parse(d).find(x=>x.name==="deck-dungeon-lb");process.stdout.write(x?x.uuid:"")})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then wrangler d1 create deck-dungeon-lb; ID=$(find_id); fi
          echo "Database: $ID"
          sed -i "s/__DB_ID__/$ID/" wrangler.toml
      - name: Create the tables (safe to re-run)
        run: wrangler d1 execute deck-dungeon-lb --remote --file schema.sql -y
      - name: Add newer columns to an older database (skips any that already exist)
        run: |
          for col in "sid TEXT" "suspect INTEGER NOT NULL DEFAULT 0" "reason TEXT" "plates INTEGER NOT NULL DEFAULT 0" "daily TEXT" "title TEXT" "killer TEXT" "heat INTEGER NOT NULL DEFAULT 0" "turbo INTEGER NOT NULL DEFAULT 0" "depth INTEGER NOT NULL DEFAULT 0"; do
            wrangler d1 execute deck-dungeon-lb --remote -y --command "ALTER TABLE runs ADD COLUMN $col" || true
          done
          wrangler d1 execute deck-dungeon-lb --remote -y --command "ALTER TABLE vault ADD COLUMN save TEXT" || true
          for col in "kind TEXT" "last_seen INTEGER"; do
            wrangler d1 execute deck-dungeon-lb --remote -y --command "ALTER TABLE sessions ADD COLUMN $col" || true
          done
      - name: Deploy the Worker
        run: wrangler deploy
      # The Great Reset: back up the database, then empty the boards, sessions and backups, once per epoch
      # (the resets table remembers which have run). Epoch 1 was the Great Reset; epoch 2 a second wipe to be sure.
      # (The Worker above already turns away anything sent from before the current epoch.)
      - name: The Great Reset (once per epoch)
        env:
          EPOCH: "3"
        run: |
          wrangler d1 execute deck-dungeon-lb --remote -y --command "CREATE TABLE IF NOT EXISTS resets (epoch INTEGER PRIMARY KEY, at INTEGER NOT NULL)"
          DONE=$(wrangler d1 execute deck-dungeon-lb --remote -y --json --command "SELECT COUNT(*) AS n FROM resets WHERE epoch = $EPOCH" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{process.stdout.write(String(JSON.parse(d)[0].results[0].n))})')
          echo "Epoch $EPOCH already reset: $DONE"
          if [ "$DONE" = "0" ]; then
            wrangler d1 export deck-dungeon-lb --remote --output pre-reset-backup.sql
            test -s pre-reset-backup.sql
            wrangler d1 execute deck-dungeon-lb --remote -y --command "DELETE FROM runs; DELETE FROM sessions; DELETE FROM vault; INSERT INTO resets (epoch, at) VALUES ($EPOCH, strftime('%s','now'))"
            echo "Wiped. Left: $(wrangler d1 execute deck-dungeon-lb --remote -y --json --command "SELECT (SELECT COUNT(*) FROM runs) + (SELECT COUNT(*) FROM sessions) + (SELECT COUNT(*) FROM vault) AS n")"
          fi
      - name: Keep the pre-reset backup
        uses: actions/upload-artifact@v4
        with:
          name: pre-reset-backup-epoch-2
          path: leaderboard/pre-reset-backup.sql
          if-no-files-found: ignore
          retention-days: 90
      - name: Check it's answering
        run: |
          URL="https://deck-dungeon-leaderboard.bestondeveloper.workers.dev"
          for i in 1 2 3 4 5 6; do curl -fsS "$URL/health" && break; sleep 5; done
          echo
          curl -fsS "$URL/leaderboard?board=floor&limit=3"
          echo
          curl -fsS -o /dev/null -w "CORS preflight: %{http_code}\n" -X OPTIONS -H "Origin: https://beston-mawarire.github.io" "$URL/runs"
